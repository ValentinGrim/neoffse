[package]
name = "neoffse-app"
description = "Desktop save editor for Final Fantasy, built with Slint"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["final-fantasy", "save-editor", "gamedev", "gui"]
categories = ["game-development", "gui"]

[dependencies]
neoffse = { workspace = true }
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[lints]
workspace = true
