[package]
name = "neoffse-app"
description = "Desktop save editor for Final Fantasy, built with Slint"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["final-fantasy", "save-editor", "gamedev", "gui"]
categories = ["game-development", "gui"]
publish = false

[dependencies]
neoffse = { workspace = true }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
] }
sys-locale = "=0.3.2"

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
neoffse-testkit = { workspace = true }
tempfile = "3.27.0"

[lints]
workspace = true
