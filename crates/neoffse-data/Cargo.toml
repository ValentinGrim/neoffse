[package]
name = "neoffse-data"
description = "Game tables of NeoFFSE (items, abilities, jobs, commands, monsters, game caps, growth and experience tables), embedded from TOML"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["final-fantasy", "save-editor", "gamedev", "data"]
categories = ["game-development"]
publish = false

[dependencies]
neoffse-core = { workspace = true }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
thiserror = "2.0.21"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[lints]
workspace = true
