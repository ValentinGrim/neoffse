[package]
name = "neoffse-format-pr"
description = "Final Fantasy I-VI Pixel Remaster save format for NeoFFSE"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["final-fantasy", "save-editor", "gamedev", "pixel-remaster"]
categories = ["game-development", "parser-implementations"]
publish = false

[dependencies]
neoffse-core = { workspace = true }
neoffse-data = { workspace = true }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
rand = { version = "0.10.3", default-features = false, features = ["thread_rng"] }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
neoffse-testkit = { workspace = true }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
