[package]
name = "neoffse-io"
description = "Safe save file handling for NeoFFSE: atomic writes, backups, restore, save discovery"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords = ["final-fantasy", "save-editor", "gamedev", "backup"]
categories = ["game-development", "filesystem"]
publish = false

[dependencies]
directories = "6.0.0"
keyvalues-parser = "0.2.4"
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"

[lints]
workspace = true
